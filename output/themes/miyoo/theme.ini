; GENERAL keys are used in case of no override in the GENERAL_RESOLUTION
[GENERAL]
is_grid = on
;Color of the font used for items in settings mode
items_font_color = AAAAAA
;Color of the font used for selected items in settings mode
selected_item_font_color = FFAE00

;Color of the font used for items in rom list mode
